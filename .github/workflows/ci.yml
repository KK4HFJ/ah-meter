name: CI
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  arduino-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn: [arduino:avr:uno, arduino:avr:nano, arduino:avr:leonardo]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          sketch-paths: firmware/AhMeter
          libraries: |
            - name: LiquidCrystal
